[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mm"
version = "0.1.0"
description = "Limit-order-book matching engine and reinforcement-learning market maker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Agastya Mehra" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "gymnasium>=1.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter"]
# Optional: independent cross-check that our from-scratch agents are competitive.
benchmark = ["stable-baselines3>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
